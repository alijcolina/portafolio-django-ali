services:
  - type: web
    name: alijcolina-portfolio
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn alijcolina.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Portafolio Ali <onboarding@resend.dev>"