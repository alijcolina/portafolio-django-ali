{% extends 'base/main.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}

<div class="main-container">
	<h3>Ingresa tu nueva contraseña</h3>

	<p>Por favor, ingresa tu nueva contraseña dos veces para que podamos verificar que la escribiste correctamente.</p>

	<form method="POST" action="">
		{% csrf_token %}
		{{form|crispy}}
		<br>
		<input class="btn btn-primary" type="submit" value="Cambiar mi contraseña">
	</form>
</div>

{% endblock content %}
